<!-- Create a form to submit a blog to a mock API (reqres.in) -->
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg p-4">
            <h2 class="text-center mb-4">Submit Your Blog</h2>
            <form id="blogForm">
                <div class="mb-3">
                    <label for="title" class="form-label">Blog Title</label>
                    <input type="text" class="form-control" id="title" placeholder="Enter blog title" required>
                </div>
                <div class="mb-3">
                    <label for="content" class="form-label">Blog Content</label>
                    <textarea class="form-control" id="content" rows="5" placeholder="Write your blog content here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Submit Blog</button>
            </form>
            <div id="responseMessage" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        document.getElementById("blogForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const title = document.getElementById("title").value;
            const content = document.getElementById("content").value;
            const responseMessage = document.getElementById("responseMessage");

            try {
                const response = await fetch("https://reqres.in/api/posts", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, content })
                });

                if (response.ok) {
                    const result = await response.json();
                    responseMessage.innerHTML = `<div class="alert alert-success">Blog submitted successfully! ID: ${result.id}</div>`;
                    document.getElementById("blogForm").reset();
                } else {
                    responseMessage.innerHTML = `<div class="alert alert-danger">Failed to submit the blog.</div>`;
                }
            } catch (error) {
                responseMessage.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
