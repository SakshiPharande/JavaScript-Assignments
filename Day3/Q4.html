<!-- Create a blog list page that fetches a list of users from a mock API and adds them to a
table on the page after loading. Add a button to sort the users by name. Add an input to
filter the table by search. (Optional: Show “Loading…” or a loading spinner on the screen
till the data loads)  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Blog List</h2>

        <!-- Search Input -->
        <div class="mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Search by name...">
        </div>

        <!-- Sort Button -->
        <button id="sortButton" class="btn btn-primary mb-3">Sort by Name</button>

        <!-- Loading Spinner -->
        <div id="loading" class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Loading data...</p>
        </div>

        <!-- User Table -->
        <table class="table table-bordered table-striped d-none" id="userTable">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Avatar</th>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </div>

    <script>
        let users = []; // Store user data globally

        // Fetch user data from API
        async function fetchUsers() {
            try {
                const response = await fetch("https://reqres.in/api/users");
                const data = await response.json();
                users = data.data;
                displayUsers(users);
            } catch (error) {
                console.error("Error fetching users:", error);
            } finally {
                document.getElementById("loading").style.display = "none";
                document.getElementById("userTable").classList.remove("d-none");
            }
        }

        // Display users in the table
        function displayUsers(userList) {
            const tableBody = document.getElementById("userTableBody");
            tableBody.innerHTML = "";
            userList.forEach(user => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td><img src="${user.avatar}" alt="Avatar" width="50" class="rounded-circle"></td>
                        <td>${user.first_name} ${user.last_name}</td>
                        <td>${user.email}</td>
                    </tr>
                `;
            });
        }

        // Sort users by name
        document.getElementById("sortButton").addEventListener("click", () => {
            users.sort((a, b) => (a.first_name + a.last_name).localeCompare(b.first_name + b.last_name));
            displayUsers(users);
        });

        // Filter users by search input
        document.getElementById("searchInput").addEventListener("input", (event) => {
            const searchTerm = event.target.value.toLowerCase();
            const filteredUsers = users.filter(user => 
                (user.first_name + " " + user.last_name).toLowerCase().includes(searchTerm)
            );
            displayUsers(filteredUsers);
        });

        // Fetch and display users on page load
        fetchUsers();
    </script>
</body>
</html>
